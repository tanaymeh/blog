<header class="post-header">
  <h1 id="page-title" class="post-title" itemprop="name headline">{{ page.title | escape | replace: '​', '<wbr>' }}</h1>
  {% if page.date %}
    <p class="post-date"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
  {% elsif page.url == '/' %}
    <p class="index-description">Notes on machine learning, data systems, and CUDA.</p>
  {% endif %}
</header>

{% if page.cover_url %}
  <figure class="post-cover">
    <img src="{{ page.cover_url | escape }}" alt="">
    {% if page.cover_meta %}<figcaption class="cover-meta">{{ page.cover_meta | markdownify }}</figcaption>{% endif %}
  </figure>
{% endif %}
