---
layout: default
---
<article class="post" lang="{{ page.lang | default: site.lang | default: 'en' }}" itemscope itemtype="https://schema.org/BlogPosting">
  {% include header.html %}
  <div class="post-content" itemprop="articleBody">{{ content }}</div>

  {% if jekyll.environment == 'production' and page.comments != false and site.disqus_shortname %}
    {% include disqus.html %}
  {% endif %}
</article>
